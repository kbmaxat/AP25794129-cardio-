name: tests

on:
  push:
    branches: [main]
    paths:
      - "ap25794129-cardio-preprocessing/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "ap25794129-cardio-preprocessing/**"
      - ".github/workflows/tests.yml"

defaults:
  run:
    working-directory: ap25794129-cardio-preprocessing

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ap25794129-cardio-preprocessing/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
