[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joig-cardio"
version = "0.1.0"
description = "Reproducibility pipeline for modality-agnostic cardiac image classification"
requires-python = ">=3.10"

[project.scripts]
joig-cardio = "joig_cardio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
